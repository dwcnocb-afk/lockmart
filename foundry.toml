[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Solidity version
solc_version = "0.8.20"

# Optimizer
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
